# chat-server 이미지를 만들어 GHCR(ghcr.io/gakdo/chat-server)에 올린다. 학교 서버 Compose가 이 이미지를 받는다.
name: chat-server 이미지

# [PR]           Dockerfile·소스가 바뀌면 빌드만 해 보고 올리지 않음
# [develop push] :커밋SHA·:develop
# [main push]    :커밋SHA·:latest
on:
  pull_request:
    paths: ["Dockerfile", ".dockerignore", "pyproject.toml", "src/**", ".github/workflows/image.yml"]
  push:
    branches: [main, develop]
    paths: ["Dockerfile", ".dockerignore", "pyproject.toml", "src/**", ".github/workflows/image.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    name: 이미지 빌드
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: 이미지 이름 정하기
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/chat-server" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: chat-server:check
          build-args: |
            APP_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # 컨테이너를 띄워 ping이 답하는지 본다(키 없이: Ollama로만 답하는 모드로 뜬다)
      - name: 이미지 실행 확인
        run: |
          docker run -d --name chk -p 18080:8080 chat-server:check
          for i in $(seq 1 20); do curl -fsS localhost:18080/api/v1/chat/ping && exit 0; sleep 1; done
          docker logs chk; exit 1
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        if: github.event_name != 'pull_request'
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ github.ref == 'refs/heads/main' && format('{0}:latest', env.IMAGE) || '' }}
            ${{ github.ref == 'refs/heads/develop' && format('{0}:develop', env.IMAGE) || '' }}
          build-args: |
            APP_COMMIT=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
